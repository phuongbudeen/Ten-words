<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0}</style>
<title>Ten Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one centred study column. Progress on top, a large flip card, then answer buttons and small tools. */
  :root {
    --bg: #EDF1F7;
    --surface: #FFFFFF;
    --ink: #14213D;
    --muted: #55617C;
    --line: #D3DAE8;
    --accent: #0F766E;
    --accent-ink: #FFFFFF;
    --miss: #B4412F;
    --mark: #F5C84B;
    --mark-ink: #14213D;
    --card-back: #14213D;
    --card-back-ink: #EDF1F7;
    --card-back-muted: #A9B6D1;
    --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1322;
      --surface: #172038;
      --ink: #E8EDF8;
      --muted: #9AA8C5;
      --line: #2A3555;
      --accent: #35C2B3;
      --accent-ink: #08201D;
      --miss: #F0907D;
      --card-back: #E8EDF8;
      --card-back-ink: #14213D;
      --card-back-muted: #4C5977;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1322;
    --surface: #172038;
    --ink: #E8EDF8;
    --muted: #9AA8C5;
    --line: #2A3555;
    --accent: #35C2B3;
    --accent-ink: #08201D;
    --miss: #F0907D;
    --card-back: #E8EDF8;
    --card-back-ink: #14213D;
    --card-back-muted: #4C5977;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 24px 40px;
  }
  .app { max-width: 460px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }

  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; line-height: 1.1; margin: 0; text-wrap: balance; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
  .count { font-family: var(--font-mono); font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s ease; }

  .scene { perspective: 1400px; }
  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    min-height: 15rem;
    border-radius: 20px;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .card.flipped .flip { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 20px;
    padding: 24px;
    display: flex; flex-direction: column; justify-content: space-between;
    min-width: 0;
  }
  .front { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 10px 30px -18px rgba(20, 33, 61, 0.45); }
  .back { background: var(--card-back); color: var(--card-back-ink); transform: rotateY(180deg); }

  .label { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .back .label { color: var(--card-back-muted); }
  .word { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.5rem, 13vw, 3.5rem); line-height: 1; margin: 0; overflow-wrap: anywhere; }
  .hint { font-size: 0.875rem; color: var(--muted); margin: 0; }
  .meaning { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; line-height: 1.25; margin: 0; text-wrap: balance; }
  .example { margin: 0; font-size: 1.0625rem; line-height: 1.5; }
  .example mark { background: var(--mark); color: var(--mark-ink); padding: 0 0.2em; border-radius: 3px; font-weight: 600; }
  .stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn {
    min-height: 52px; padding: 12px 16px; border-radius: 14px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    font-weight: 600; font-size: 1rem;
  }
  .btn.miss { color: var(--miss); border-color: var(--miss); background: transparent; }
  .btn.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:active { transform: translateY(1px); }

  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; }
  .tool { background: none; border: 0; color: var(--muted); padding: 10px 12px; border-radius: 10px; font-size: 0.9375rem; font-weight: 500; }
  .tool:hover { color: var(--ink); background: var(--surface); }
  .tool:disabled { opacity: 0.4; cursor: default; background: none; color: var(--muted); }

  .done { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .done h2 { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; margin: 0; text-wrap: balance; }
  .done p { margin: 0; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .chips li { font-family: var(--font-mono); font-size: 0.875rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--miss); color: var(--miss); }
  .done .answers { grid-template-columns: 1fr; }

  @media (prefers-reduced-motion: reduce) {
    .flip, .bar span { transition: none; }
  }
</style>
</head>
<body>

<main class="app">
  <header class="top">
    <div>
      <h1>Ten Words</h1>
      <p class="sub" id="mode">Everyday English</p>
    </div>
    <div class="count" id="count">1 / 10</div>
  </header>
  <div class="bar" id="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><span id="barfill"></span></div>

  <section id="study" class="app" style="gap:16px">
    <div class="scene">
      <div class="card" id="card" role="button" tabindex="0" aria-pressed="false">
        <div class="flip">
          <div class="face front">
            <span class="label" id="pos">verb</span>
            <h2 class="word" id="word">improve</h2>
            <p class="hint">Tap the card to see the meaning</p>
          </div>
          <div class="face back">
            <span class="label" id="backword">improve</span>
            <div class="stack">
              <p class="meaning" id="meaning"></p>
              <p class="example" id="example"></p>
            </div>
            <span class="label">Tap to flip back</span>
          </div>
        </div>
      </div>
    </div>

    <div class="answers">
      <button class="btn miss" id="btnMiss" type="button">Still learning</button>
      <button class="btn ok" id="btnKnown" type="button">Got it</button>
    </div>

    <div class="tools">
      <button class="tool" id="btnBack" type="button">&larr; Back</button>
      <button class="tool" id="btnListen" type="button">Listen</button>
      <button class="tool" id="btnShuffle" type="button">Shuffle</button>
      <button class="tool" id="btnSkip" type="button">Skip &rarr;</button>
    </div>
  </section>

  <section id="done" class="done" hidden>
    <h2 id="doneTitle"></h2>
    <p id="doneText"></p>
    <ul class="chips" id="doneChips"></ul>
    <div class="answers">
      <button class="btn ok" id="btnReview" type="button">Review missed words</button>
      <button class="btn" id="btnRestart" type="button">Start over</button>
    </div>
  </section>
</main>

<script>
  var WORDS = [
    { w: "Improve",    p: "verb",      m: "To make something better.",                          e: "I want to improve my English." },
    { w: "Habit",      p: "noun",      m: "Something you do regularly.",                        e: "Reading every night is a good habit." },
    { w: "Challenge",  p: "noun",      m: "Something difficult that tests you.",                e: "Learning to code is a challenge." },
    { w: "Patient",    p: "adjective", m: "Able to wait calmly.",                               e: "Be patient, it takes time." },
    { w: "Goal",       p: "noun",      m: "Something you want to achieve.",                     e: "My goal is to get a new job." },
    { w: "Practice",   p: "verb",      m: "To do something again and again to get better.",     e: "Practice every day." },
    { w: "Understand", p: "verb",      m: "To know the meaning of something.",                  e: "I don't understand this word." },
    { w: "Remember",   p: "verb",      m: "To keep something in your mind.",                    e: "I remember her name." },
    { w: "Suggest",    p: "verb",      m: "To offer an idea.",                                  e: "I suggest we start now." },
    { w: "Progress",   p: "noun",      m: "Improvement over time.",                             e: "You're making great progress." }
  ];

  var deck = WORDS.map(function (_, i) { return i; });
  var pos = 0, flipped = false, busy = false, reviewing = false;
  var known = {}, missed = {};

  function $(id) { return document.getElementById(id); }
  var card = $("card");

  function keys(o) { return Object.keys(o).map(Number).sort(function (a, b) { return a - b; }); }

  function fillExample(el, sentence, word) {
    el.textContent = "";
    var re = new RegExp("(" + word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "i");
    var parts = sentence.split(re);
    parts.forEach(function (part) {
      if (part.toLowerCase() === word.toLowerCase()) {
        var m = document.createElement("mark");
        m.textContent = part;
        el.appendChild(m);
      } else if (part) {
        el.appendChild(document.createTextNode(part));
      }
    });
  }

  function setFlipped(v) {
    flipped = v;
    card.classList.toggle("flipped", v);
    card.setAttribute("aria-pressed", v ? "true" : "false");
  }

  function render() {
    var item = WORDS[deck[pos]];
    $("word").textContent = item.w.toLowerCase();
    $("pos").textContent = item.p;
    $("backword").textContent = item.w.toLowerCase();
    $("meaning").textContent = item.m;
    fillExample($("example"), item.e, item.w);
    $("count").textContent = (pos + 1) + " / " + deck.length;
    var pct = (pos / deck.length) * 100;
    $("barfill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuemax", String(deck.length));
    $("bar").setAttribute("aria-valuenow", String(pos));
    $("mode").textContent = reviewing ? "Reviewing missed words" : "Everyday English";
    $("btnBack").disabled = pos === 0;
    card.setAttribute("aria-label", "Flashcard: " + item.w.toLowerCase() + ". Press to reveal the meaning.");
  }

  function reducedMotion() {
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
  }

  function goTo(n) {
    if (busy) return;
    if (n >= deck.length) { finish(); return; }
    if (n < 0) return;
    if (flipped) {
      busy = true;
      setFlipped(false);
      setTimeout(function () { pos = n; render(); busy = false; }, reducedMotion() ? 0 : 220);
    } else {
      pos = n; render();
    }
  }

  function answer(kind) {
    if (busy) return;
    var idx = deck[pos];
    if (kind === "known") { known[idx] = true; delete missed[idx]; }
    else { missed[idx] = true; delete known[idx]; }
    goTo(pos + 1);
  }

  function finish() {
    setFlipped(false);
    $("study").hidden = true;
    $("done").hidden = false;
    $("barfill").style.width = "100%";
    $("count").textContent = deck.length + " / " + deck.length;
    var k = keys(known).length, m = keys(missed);
    $("doneTitle").textContent = m.length === 0 ? "All ten words known" : k + " of " + WORDS.length + " words known";
    $("doneText").textContent = m.length === 0
      ? "Come back tomorrow and try again. Spaced practice is how words stay in your head."
      : "These are the words to look at again:";
    var ul = $("doneChips");
    ul.textContent = "";
    m.forEach(function (i) {
      var li = document.createElement("li");
      li.textContent = WORDS[i].w.toLowerCase();
      ul.appendChild(li);
    });
    ul.hidden = m.length === 0;
    $("btnReview").hidden = m.length === 0;
  }

  function startRound(indices, isReview) {
    deck = indices.slice();
    pos = 0; reviewing = isReview; busy = false;
    setFlipped(false);
    $("done").hidden = true;
    $("study").hidden = false;
    render();
  }

  function shuffle() {
    if (busy) return;
    var a = deck.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    startRound(a, reviewing);
  }

  card.addEventListener("click", function () { if (!busy) setFlipped(!flipped); });
  card.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!busy) setFlipped(!flipped); }
  });
  document.addEventListener("keydown", function (e) {
    if ($("study").hidden) return;
    if (e.key === "ArrowRight") goTo(pos + 1);
    if (e.key === "ArrowLeft") goTo(pos - 1);
  });

  $("btnKnown").addEventListener("click", function () { answer("known"); });
  $("btnMiss").addEventListener("click", function () { answer("miss"); });
  $("btnBack").addEventListener("click", function () { goTo(pos - 1); });
  $("btnSkip").addEventListener("click", function () { goTo(pos + 1); });
  $("btnShuffle").addEventListener("click", shuffle);
  $("btnRestart").addEventListener("click", function () {
    known = {}; missed = {};
    startRound(WORDS.map(function (_, i) { return i; }), false);
  });
  $("btnReview").addEventListener("click", function () { startRound(keys(missed), true); });

  var canSpeak = false;
  try { canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function"; } catch (e) {}
  if (!canSpeak) { $("btnListen").hidden = true; }
  $("btnListen").addEventListener("click", function () {
    try {
      var u = new SpeechSynthesisUtterance(WORDS[deck[pos]].w.toLowerCase());
      u.lang = "en-GB";
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  });

  render();
</script>

</body>
</html>

</body></html>
